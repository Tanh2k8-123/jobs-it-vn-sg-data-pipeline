name: validate
on: [push, pull_request]
jobs:
  python-and-dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          enable-cache: true
      - run: uv sync --frozen --extra cloud --extra dev --extra databricks
      - run: uv run ruff check src tests dashboard scripts
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest -q
      - run: uv run python scripts/compile_bigquery_offline.py
      - run: uv run python scripts/render_databricks_sql.py
      - run: docker compose config --quiet
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
