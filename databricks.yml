bundle:
  name: tech-jobs-free-edition

sync:
  exclude:
    - local-learning/**

workspace:
  # Select your workspace with --profile; keep personal hosts out of the bundle.
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

variables:
  catalog:
    description: Existing catalog in your Free Edition workspace.
    default: workspace
  prefix:
    description: Project-specific prefix for Bronze, Silver and Gold schemas.
    default: tech_jobs

resources:
  schemas:
    bronze:
      catalog_name: ${var.catalog}
      name: ${var.prefix}_bronze
      comment: Original immutable snapshot envelopes for Tech Jobs Analytics.
    silver:
      catalog_name: ${var.catalog}
      name: ${var.prefix}_silver
      comment: Normalized postings and reusable classification rules.
    gold:
      catalog_name: ${var.catalog}
      name: ${var.prefix}_gold
      comment: Daily analytics and dashboard views.
  volumes:
    raw_snapshots:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.bronze.name}
      name: raw_snapshots
      volume_type: MANAGED
  jobs:
    tech_jobs_daily:
      name: Tech Jobs Analytics — Free Edition
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: '0 0 7 * * ?'
        timezone_id: Asia/Ho_Chi_Minh
        pause_status: PAUSED
      parameters:
        - name: source_mode
          default: volume
        - name: require_fresh
          default: 'true'
      environments:
        - environment_key: notebook_env
          spec:
            environment_version: '4'
            dependencies:
              - requests==2.34.2
              - python-dotenv==1.2.4
              - Jinja2==3.1.6
              - PyYAML==6.0.3
      tasks:
        - task_key: setup
          environment_key: notebook_env
          notebook_task:
            notebook_path: ./databricks/notebooks/00_setup.py
            base_parameters: &parameters
              repo_root: ${workspace.file_path}
              catalog: ${var.catalog}
              prefix: ${var.prefix}
              source_mode: '{{job.parameters.source_mode}}'
              require_fresh: '{{job.parameters.require_fresh}}'
              run_id: 'dbx_{{job.run_id}}'
        - task_key: ingest_bronze
          depends_on: [{task_key: setup}]
          environment_key: notebook_env
          notebook_task:
            notebook_path: ./databricks/notebooks/01_ingest_bronze.py
            base_parameters: *parameters
        - task_key: build_silver_gold
          depends_on: [{task_key: ingest_bronze}]
          environment_key: notebook_env
          notebook_task:
            notebook_path: ./databricks/notebooks/02_build_silver_gold.py
            base_parameters: *parameters
        - task_key: quality_checks
          depends_on: [{task_key: build_silver_gold}]
          environment_key: notebook_env
          notebook_task:
            notebook_path: ./databricks/notebooks/03_quality_checks.py
            base_parameters: *parameters

targets:
  dev:
    default: true
    # Run manually first; enable scheduling after verifying fresh daily collection.
    mode: development
